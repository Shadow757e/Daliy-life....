<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Evil/Olivia App</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#08090b">
    
    <link rel="apple-touch-icon" href="love.jpg">
    <link rel="icon" href="love.jpg" type="image/jpeg">

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --hacker-green: #00ff88; 
            --nurse-red: #ff4d6d; 
            --dark-bg: #08090b; 
            --glass-bg: rgba(255, 255, 255, 0.03); 
            --glass-border: rgba(255, 255, 255, 0.08);
            --glow-green: 0 0 20px rgba(0, 255, 136, 0.2);
            --glow-red: 0 0 20px rgba(255, 77, 109, 0.2);
        }

        body { 
            background: radial-gradient(circle at 20% 20%, #1a1c25 0%, var(--dark-bg) 50%);
            font-family: 'Cairo', sans-serif; 
            color: #e0e0e0; 
            margin: 0; 
            padding: 0; 
            min-height: 100vh;
            overscroll-behavior-y: contain;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.5s ease;
        }

        /* أنماط الخلفيات الشخصية المتاحة */
        body.theme-default { background: radial-gradient(circle at 20% 20%, #1a1c25 0%, var(--dark-bg) 50%); }
        body.theme-pure-dark { background: #050507; }
        body.theme-hacker { background: radial-gradient(circle at bottom, #001a08 0%, #020203 80%); }
        body.theme-nurse { background: radial-gradient(circle at top, #200408 0%, #050203 80%); }
        body.theme-romantic { background: linear-gradient(135deg, #1f1115 0%, #0a0608 100%); }

        ::-webkit-scrollbar { display: none; }

        #hacker-screen { 
            position: fixed; inset: 0; background: #000; z-index: 20000; display: block; 
            transition: transform 0.5s cubic-bezier(0.7, 0, 0.3, 1), opacity 0.4s ease-in;
        }
        #matrix-bg { position: absolute; top: 0; left: 0; opacity: 0.3; width: 100%; height: 100%; }
        #term-box { position: relative; z-index: 20001; padding: 30px; font-family: monospace; color: var(--hacker-green); }
        .t-line { margin-bottom: 8px; font-size: 14px; text-shadow: 0 0 5px var(--hacker-green); }
        #p-bar-box { width: 180px; height: 3px; background: #020; margin: 20px 0; display: none; overflow: hidden; }
        #p-bar { width: 0%; height: 100%; background: var(--hacker-green); box-shadow: 0 0 10px var(--hacker-green); transition: width 0.1s; }
        #auth-area { display: none; align-items: center; margin-top: 15px; }
        #pass-input-term { background: transparent; border: none; color: #fff; font-size: 24px; outline: none; width: 120px; letter-spacing: 5px; font-family: monospace; font-weight: bold; }

        .hacker-exit { transform: scale(0.1); opacity: 0; filter: blur(15px); pointer-events: none; }
        .hacker-shake { animation: terminalShake 0.15s infinite; filter: hue-rotate(90deg) contrast(1.5); }

        @keyframes terminalShake {
            0% { transform: translate(3px, 0px); }
            25% { transform: translate(-3px, 2px); }
            50% { transform: translate(3px, -2px); }
            75% { transform: translate(-3px, 1px); }
            100% { transform: translate(0px, 0px); }
        }

        .container { max-width: 480px; margin: auto; display: none; padding: 20px; padding-bottom: 100px; }
        #real-timer { text-align: center; margin-bottom: 20px; }
        .days-big { font-size: 2.2rem; font-weight: 800; display: block; color: var(--hacker-green); text-shadow: var(--glow-green); }
        .hms-small { font-size: 1.1rem; color: var(--nurse-red); font-weight: 600; letter-spacing: 1px; }
        #distance-info { text-align: center; font-size: 0.8rem; color: #888; margin-top: -15px; margin-bottom: 15px; }
        .tabs { display: flex; background: var(--glass-bg); border-radius: 20px; margin-bottom: 25px; padding: 6px; gap: 8px; border: 1px solid var(--glass-border); overflow-x: auto; scrollbar-width: none; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: transparent; color: #777; cursor: pointer; border-radius: 15px; font-weight: 800; transition: 0.3s; white-space: nowrap; }
        .tab-btn.active { background: var(--nurse-red); color: white; box-shadow: var(--glow-red); }
        .tab-btn.active.y-theme { background: var(--hacker-green); color: #000; box-shadow: var(--glow-green); }
        .card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 30px; padding: 22px; margin-bottom: 20px; backdrop-filter: blur(10px); }
        .m-border { border-right: 5px solid var(--nurse-red); }
        .y-border { border-right: 5px solid var(--hacker-green); }
        .section { display: none; }
        .section.active { display: block; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        #chat-box, #wish-list, #dynamic-tasks-m, #dynamic-tasks-y, #memories-list, #music-list { height: 320px; overflow-y: auto; background: rgba(0,0,0,0.2); border-radius: 25px; padding: 15px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--glass-border); scroll-behavior: smooth; }
        #memories-list { height: 400px; }
        .msg { padding: 10px 15px; border-radius: 18px; max-width: 85%; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; position: relative; }
        .msg.يوسف { align-self: flex-end; background: #00331a; color: var(--hacker-green); border-bottom-right-radius: 4px; }
        .msg.مريم { align-self: flex-start; background: #330011; color: var(--nurse-red); border-bottom-left-radius: 4px; }
        
        .input-group { display: flex; gap: 8px; margin-top: 10px; }
        .input-group input { flex: 1; background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border); color: white; padding: 12px 18px; border-radius: 15px; outline: none; font-family: 'Cairo'; }
        
        #moto-btn { 
            width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; 
            border: none; background: var(--hacker-green) !important; box-shadow: 0 0 15px var(--hacker-green); cursor: pointer; 
        }
        #moto-btn i { color: #000 !important; font-size: 1.4rem; }
        @keyframes motoLaunch { 0% { transform: translateX(0); opacity: 1; } 40% { transform: translateX(15px) scale(1.1); opacity: 1; } 100% { transform: translateX(-60px); opacity: 0; } }
        .moto-active { animation: motoLaunch 0.4s ease-in-out; }
        
        .nudge-btn { position: fixed; bottom: 20px; left: 20px; width: 65px; height: 65px; border-radius: 50%; border: none; background: var(--nurse-red); color: white; font-size: 1.5rem; cursor: pointer; z-index: 999; box-shadow: var(--glow-red); transition: transform 0.2s; }
        .heart-pulse { animation: syncPulse 0.6s infinite !important; background: #ff0000 !important; box-shadow: 0 0 30px #ff0000 !important; }
        
        @keyframes syncPulse { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }
        @keyframes heartbeat { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .nudge-btn:not(.heart-pulse) { animation: heartbeat 1.5s infinite; }

        #nudge-msg { position: fixed; top: -100px; left: 50%; transform: translateX(-50%); background: white; color: #000; padding: 15px 30px; border-radius: 50px; font-weight: 800; transition: 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 10001; }

        #custom-menu {
            position: fixed; background: #12141a; border: 1px solid var(--hacker-green);
            border-radius: 12px; padding: 0; z-index: 30000; display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); min-width: 150px; overflow: hidden;
        }
        .reactions-picker { display: flex; justify-content: space-around; padding: 10px; background: rgba(255,255,255,0.05); border-bottom: 1px solid #333; }
        .react-btn { cursor: pointer; font-size: 1.2rem; transition: 0.2s; }
        .react-btn:hover { transform: scale(1.3); }
        
        .menu-item {
            padding: 12px 20px; color: white; font-size: 0.9rem; cursor: pointer;
            transition: 0.2s; display: flex; align-items: center; gap: 10px;
        }
        .menu-item:hover { background: rgba(0, 255, 136, 0.1); color: var(--hacker-green); }
        .menu-item.delete-item { color: #ff4d6d; }
        .menu-item.delete-item:hover { background: rgba(255, 77, 109, 0.1); }

        .reaction-container { position: absolute; bottom: -10px; background: #1a1c25; border: 1px solid var(--glass-border); border-radius: 10px; padding: 1px 5px; font-size: 0.75rem; z-index: 5; animation: popReact 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .msg.يوسف .reaction-container { right: 10px; }
        .msg.مريم .reaction-container { left: 10px; }
        @keyframes popReact { from { transform: scale(0); } to { transform: scale(1); } }
        
        .reply-content { background: rgba(255,255,255,0.1); border-left: 3px solid var(--hacker-green); padding: 5px 8px; border-radius: 5px; margin-bottom: 5px; font-size: 0.75rem; opacity: 0.8; cursor: pointer; }
        
        #reply-preview { display: none; background: #111; padding: 10px; border-top: 2px solid var(--hacker-green); color: #ccc; font-size: 0.8rem; position: relative; }
        #typing-status { font-size: 0.75rem; color: var(--hacker-green); margin-bottom: 5px; height: 15px; opacity: 0.8; font-style: italic; padding-right: 10px; }
        .seen-status { font-size: 0.65rem; display: block; text-align: left; opacity: 0.6; margin-top: 2px; }
        .msg.مريم .seen-status { text-align: right; }

        .task-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background: rgba(255,255,255,0.04); border-radius: 15px; border: 1px solid var(--glass-border); transition: 0.3s; }
        .task-item.completed { opacity: 0.5; background: rgba(0, 255, 136, 0.03); }
        .task-item.completed span { text-decoration: line-through; color: #888; }
        .task-item i { cursor: pointer; font-size: 1.2rem; transition: 0.2s; }
        .task-item i:hover { transform: scale(1.1); }
        
        .memory-card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 25px; padding: 15px; display: flex; flex-direction: column; gap: 10px; position: relative; }
        .memory-card img { width: 100%; border-radius: 20px; max-height: 250px; object-fit: cover; }
        .memory-meta { font-size: 0.75rem; color: #777; display: flex; justify-content: space-between; }
        .memory-delete { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.6); border: none; color: var(--nurse-red); width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        .music-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background: rgba(255,255,255,0.04); border-radius: 15px; border: 1px solid var(--glass-border); transition: 0.3s; }
        .music-item .music-info { display: flex; align-items: center; gap: 12px; cursor: pointer; flex: 1; }
        .music-item i.fa-play-circle { font-size: 1.4rem; color: var(--hacker-green); }
        .music-item i.fa-trash-alt { color: var(--nurse-red); cursor: pointer; transition: 0.2s; }
        .music-item i.fa-trash-alt:hover { transform: scale(1.2); }

        /* ستايل أدوات التحكم في الخلفية الشخصية */
        .theme-picker-container { display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 20px; background: var(--glass-bg); padding: 10px; border-radius: 20px; border: 1px solid var(--glass-border); }
        .theme-dot { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
        .theme-dot.active { border-color: #fff; transform: scale(1.15); }
        .td-default { background: linear-gradient(to bottom right, #1a1c25, #08090b); }
        .td-pure-dark { background: #050507; border: 1px solid #333; }
        .td-hacker { background: #001a08; }
        .td-nurse { background: #200408; }
        .td-romantic { background: #1f1115; }
    </style>
</head>
<body>

<audio id="nudge-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>
<div id="nudge-msg">❤️ بيفكر فيكِ حالاً!</div>

<div id="hacker-screen">
    <canvas id="matrix-bg"></canvas>
    <div id="term-box">
        <div id="log-c"></div>
        <div id="p-bar-box"><div id="p-bar"></div></div>
        <div id="auth-area">
            <span>> PASSWORD_REQUIRED:</span><br>
            <input type="password" id="pass-input-term" maxlength="4" placeholder="****" inputmode="numeric" autocomplete="off">
        </div>
    </div>
</div>

<div id="custom-menu">
    <div class="reactions-picker">
        <span class="react-btn" onclick="addReact('❤️')">❤️</span>
        <span class="react-btn" onclick="addReact('😂')">😂</span>
        <span class="react-btn" onclick="addReact('🔥')">🔥</span>
        <span class="react-btn" onclick="addReact('👍')">👍</span>
    </div>
    <div class="menu-item" onclick="startReply()"><i class="fas fa-reply"></i> رد</div>
    <div class="menu-item" id="menu-edit"><i class="fas fa-edit"></i> تعديل</div>
    <div class="menu-item delete-item" id="menu-delete"><i class="fas fa-trash"></i> حذف</div>
</div>

<button class="nudge-btn" id="floating-paw" 
        onclick="window.open('https://youssef7878adam.github.io/Happy-massege-Mariomty/', '_blank'); triggerVibrate(50);">
    <i class="fas fa-paw"></i>
</button>

<div class="container" id="main-content">
    <div id="real-timer">
        <span class="days-big" id="days-val">0 Days</span>
        <span class="hms-small" id="hms-val">00:00:00</span>
    </div>
    <div id="distance-info">📍 جاري تحديد المسافة...</div>
    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('mood', this)">المود</button>
        <button class="tab-btn" onclick="showTab('tasks', this)">المهام</button>
        <button class="tab-btn" onclick="showTab('wishes', this)">الأمنيات</button>
        <button class="tab-btn" onclick="showTab('memories', this)">ذكرياتنا</button>
        <button class="tab-btn" onclick="showTab('music', this)">الموسيقى</button>
        <button class="tab-btn" onclick="showTab('questions', this)">سؤال</button>
        <button class="tab-btn" onclick="showTab('chat', this)">الشات</button>
    </div>

    <!-- لوحة التحكم بالهوية والخلفية المخصصة غير المشتركة -->
    <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px;">
        <div style="text-align: center;">
            <select id="user-role" onchange="syncRole()" style="background:var(--glass-bg); color:white; border:1px solid var(--glass-border); padding:10px; border-radius:15px; font-family:'Cairo'; width: 100%;">
                <option value="يوسف">يوسف 🧑‍💻</option>
                <option value="مريم">مريم 🩺</option>
            </select>
        </div>
        
        <div class="theme-picker-container">
            <span style="font-size:0.75rem; color:#888; margin-left: auto;">خلفيتك الخاصة:</span>
            <div class="theme-dot td-default active" onclick="changePersonalTheme('theme-default', this)" title="الافتراضي"></div>
            <div class="theme-dot td-pure-dark" onclick="changePersonalTheme('theme-pure-dark', this)" title="أسود داكن"></div>
            <div class="theme-dot td-hacker" onclick="changePersonalTheme('theme-hacker', this)" title="هكر أخضر"></div>
            <div class="theme-dot td-nurse" onclick="changePersonalTheme('theme-nurse', this)" title="طبي أحمر"></div>
            <div class="theme-dot td-romantic" onclick="changePersonalTheme('theme-romantic', this)" title="رومانسي دافئ"></div>
        </div>
    </div>

    <div id="mood" class="section active">
        <div class="card m-border"><h3 style="color:var(--nurse-red); margin:0; font-size:0.8rem;">مود مريم 🩺</h3><p id="m-mood-display">...</p><div id="m-mood-ctrl" class="input-group" style="display:none"><input type="text" id="m-mood-text" placeholder="مودِك دلوقتي Oz"><button class="tab-btn active" onclick="updateMood('m')">تحديث</button></div></div>
        <div class="card y-border"><h3 style="color:var(--hacker-green); margin:0; font-size:0.8rem;">مود يوسف 🧑‍💻</h3><p id="y-mood-display">...</p><div id="y-mood-ctrl" class="input-group" style="display:none"><input type="text" id="y-mood-text" placeholder="مودك دلوقتي؟"><button class="tab-btn active y-theme" onclick="updateMood('y')">تحديث</button></div></div>
    </div>
    
    <div id="tasks" class="section">
        <div class="card m-border">
            <b style="color:var(--nurse-red);">قائمة مهام مريومهع 🩺:</b>
            <div id="dynamic-tasks-m" style="height:160px; margin-top:10px;"></div>
            <div id="y-to-m-ctrl" class="input-group" style="display:none">
                <input type="text" id="input-to-m" placeholder="أعطها مهمة جديدة...">
                <button class="tab-btn active y-theme" onclick="saveTask('m')">إرسال</button>
            </div>
        </div>
        <div class="card y-border">
            <b style="color:var(--hacker-green);">قائمة مهام سفسوفهع 🧑‍💻:</b>
            <div id="dynamic-tasks-y" style="height:160px; margin-top:10px;"></div>
            <div id="m-to-y-ctrl" class="input-group" style="display:none">
                <input type="text" id="input-to-y" placeholder="أعطه مهمة جديدة...">
                <button class="tab-btn active" onclick="saveTask('y')">إرسال</button>
            </div>
        </div>
    </div>
    
    <div id="wishes" class="section"><div class="card"><h3 style="color:var(--nurse-red); margin-top:0;">صندوق الأمنيات ✨</h3><div id="wish-list"></div><div class="input-group"><input type="text" id="wish-in" placeholder="أمنية جديدة..."><button class="tab-btn active y-theme" onclick="addWish()">إضافة</button></div></div></div>
    
    <div id="memories" class="section">
        <div class="card">
            <h3 style="color:var(--hacker-green); margin-top:0;">صندوق ذكرياتنا الدافئة 📸</h3>
            <div id="memories-list"></div>
            <div class="input-group" style="flex-direction: column; gap: 10px;">
                <label for="memory-file" style="display: flex; align-items: center; justify-content: center; gap: 10px; background: rgba(0, 255, 136, 0.05); border: 1px dashed var(--hacker-green); color: var(--hacker-green); padding: 12px; border-radius: 15px; cursor: pointer; font-weight: bold; width: 100%; box-sizing: border-box;">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <span id="file-label">اختر صورة من الموبايل...</span>
                </label>
                <input type="file" id="memory-file" accept="image/*" style="display: none;" onchange="handleFileSelect(this)">
                
                <div style="display:flex; gap:8px; width:100%;">
                    <input type="text" id="memory-text" placeholder="اكتب كلمة للذكرى...">
                    <button class="tab-btn active y-theme" onclick="addMemory()" style="flex:none; width:80px;">حفظ</button>
                </div>
            </div>
        </div>
    </div>

    <div id="music" class="section">
        <div class="card">
            <h3 style="color:var(--hacker-green); margin-top:0;">صندوق الموسيقى المشترك 🎵</h3>
            <div id="music-list"></div>
            <div class="input-group" style="flex-direction: column; gap: 8px;">
                <input type="text" id="music-name" placeholder="اسم الأغنية أو التراك...">
                <div style="display:flex; gap:8px; width:100%;">
                    <input type="text" id="music-link" placeholder="ضع رابط الأغنية (يوتيوب / ساوند)...">
                    <button class="tab-btn active y-theme" onclick="addMusicTrack()" style="flex:none; width:80px;">إضافة</button>
                </div>
            </div>
        </div>
    </div>

    <div id="questions" class="section"><div class="card" style="text-align: center;"><h3 id="daily-q-text" style="color:var(--hacker-green); margin-bottom:15px; min-height: 60px;">...</h3><textarea id="ans-in" style="width:100%; height:100px; background:rgba(0,0,0,0.3); border:1px solid var(--glass-border); color:white; border-radius:15px; padding:15px; font-family:'Cairo'; resize:none;" placeholder="إجابتك السرية..."></textarea><button class="tab-btn active y-theme" style="margin-top:10px; width:100%;" onclick="saveAns()">حفظ الإجابة</button></div></div>
    <div id="chat" class="section">
        <div id="typing-status"></div>
        <div id="chat-box"></div>
        <div id="reply-preview">
            <div id="reply-preview-text" style="border-right: 3px solid var(--hacker-green); padding-right: 10px;"></div>
            <i class="fas fa-times" onclick="cancelReply()" style="position:absolute; left:15px; top:10px; color:var(--nurse-red);"></i>
        </div>
        <div class="input-group" style="background:rgba(255,255,255,0.08); padding:8px; border-radius:50px; border:1px solid var(--hacker-green); align-items:center;">
            <input type="text" id="msg-input" placeholder="اكتب شيئاً..." style="background:none; border:none; padding-left:15px; flex:1; color: white;" onkeypress="if(event.key==='Enter') sendMsg()">
            <button id="moto-btn" onclick="sendMsg()"><i class="fas fa-motorcycle"></i></button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://youssef-mariam-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    db.ref('locations').on('value', snap => {

            document.getElementById('distance-info').innerText = `📍 المسافة بينكما: ${dist.toFixed(2)} كم`;
        }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371; const dLat = (lat2 - lat1) * Math.PI / 180; const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

        div.setAttribute('data-key', key); div.setAttribute('data-time', d.time);
        renderInnerMsg(div, d);
        let timer;
        div.ontouchstart = (e) => timer = setTimeout(() => handleMsgAction(key, d.t, e, d.s), 700);
        div.ontouchend = () => clearTimeout(timer);
        div.oncontextmenu = (e) => { e.preventDefault(); handleMsgAction(key, d.t, e, d.s); };

        db.ref('last_seen').once('value', snap => {
            const seenData = snap.val(); const otherRole = (sender === 'يوسف') ? 'مريم' : 'يوسف';
            if(seenData && seenData[otherRole] && seenData[otherRole] > msgTime) {
                if(!m.querySelector('.seen-status')) {
                    const s = document.createElement('span'); s.className = 'seen-status';
                    s.innerHTML = '<i class="fas fa-check-double" style="color:var(--hacker-green)"></i> شوهد';
                    m.appendChild(s);
                }
            }
        });
    }

    db.ref('last_seen').on('value', snap => {
        const seenData = snap.val();
        document.querySelectorAll('.msg').forEach(m => {
            const msgTime = m.getAttribute('data-time'), sender = m.getAttribute('data-sender'), otherRole = (sender === 'يوسف') ? 'مريم' : 'يوسف';
            if(seenData && seenData[otherRole] && seenData[otherRole] > msgTime) {
                if(!m.querySelector('.seen-status')) {
                    const s = document.createElement('span'); s.className = 'seen-status';
                    s.innerHTML = '<i class="fas fa-check-double" style="color:var(--hacker-green)"></i> شوهد';
                    m.appendChild(s);
                }
            }
        });
    });

    function handleMsgAction(key, oldText, e, sender) {
        selectedMsgKey = key; selectedMsgText = oldText; selectedMsgSender = sender;
        const myRole = document.getElementById('user-role').value; const menu = document.getElementById('custom-menu');
        document.getElementById('menu-edit').style.display = (sender === myRole) ? 'flex' : 'none';
        document.getElementById('menu-delete').style.display = (sender === myRole) ? 'flex' : 'none';
        menu.style.display = 'block';
        let x = (e.pageX || (e.touches ? e.touches[0].pageX : 0)), y = (e.pageY || (e.touches ? e.touches[0].pageY : 0));
        menu.style.left = Math.min(x, window.innerWidth - 160) + 'px'; menu.style.top = Math.min(y, window.innerHeight - 200) + 'px';
        triggerVibrate(50);
    }

    window.onclick = (e) => { if(!e.target.closest('.msg') && !e.target.closest('#custom-menu')) document.getElementById('custom-menu').style.display = 'none'; };
    document.getElementById('menu-edit').onclick = () => { const newT = prompt("عدل رسالتك:", selectedMsgText); if (newT && newT.trim() !== selectedMsgText) db.ref('msgs/' + selectedMsgKey).update({ t: newT }); };
    document.getElementById('menu-delete').onclick = () => { if (confirm("حذف الرسالة نهائياً؟")) db.ref('msgs/' + selectedMsgKey).remove(); };
</script>
</body>
